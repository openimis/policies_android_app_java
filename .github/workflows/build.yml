name: Android CI/CD - develop-comores

on:
  push:
    branches: [ "feature-31756" ]   
  pull_request:
    branches: [ "feature-31756" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Decode keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > policies_comores.jks

    - name: Set up Gradle
      uses: gradle/gradle-build-action@v2
      with:
        # Solution pour l'erreur 422 - soit désactiver soit configurer proprement
        cache-read-only: false
        gradle-home-cache-cleanup: true

    - name: Build release APK
      run: ./gradlew assembleComoresDevRelease --stacktrace
      env:
        KEYSTORE_FILE: policies_comores.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Verify APK exists
      run: |
        APK_PATH="app/build/outputs/apk/comoresDev/release/app-comoresDev-release.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "::error::APK not found at $APK_PATH"
          ls -R app/build/outputs/apk/
          exit 1
        else
          echo "APK found at $APK_PATH"
          ls -lh "$APK_PATH"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: policies-release-apk
        path: app/build/outputs/apk/comoresDev/release/app-comoresDev-release.apk