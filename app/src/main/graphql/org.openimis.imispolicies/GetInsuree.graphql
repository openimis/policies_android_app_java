query GetInsuree($chFid: String) {
    insurees(chfId: $chFid, ignoreLocation: true){
        edges {
            node {
                id
                chfId
                uuid
                phone
                head
                passport
                lastName
                otherNames
                dob
                gender {
                    code
                }
                marital
                cardIssued
                relationship {
                    id
                    altLanguage
                }
                profession {
                    id
                    altLanguage
                }
                education {
                    id
                    altLanguage
                }
                email
                typeOfId {
                    code
                    altLanguage
                }
                healthFacility {
                    id
                    uuid
                    legacyId
                }
                currentAddress
                geolocation
                currentVillage {
                    id
                }
                photo {
                    photo
                    filename
                    folder
                }
                offline
                incomeLevel {
                    id
                }
                professionalSituation
                preferredPaymentMethod
                bankCoordinates
                coordinates
            }
        }
    }
}